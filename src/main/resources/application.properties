spring.application.name=smartfood-backend

server.port=8080

# ==============================
# DATABASE
# ==============================
spring.datasource.url=jdbc:mysql://localhost:3306/smartfood_db
spring.datasource.username=root
spring.datasource.password=Alfiya@1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==============================
# JPA / HIBERNATE
# ==============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Hibernate automatically detects MySQL
# so no explicit hibernate.dialect is required.

# ==============================
# THYMELEAF
# ==============================
spring.thymeleaf.cache=false

# ==============================
# FILE UPLOAD
# ==============================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB