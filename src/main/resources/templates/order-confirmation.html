<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Order Confirmed | SmartFood</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #fff7f3, #f7f9fc);
            color: #222;
        }

        .navbar {
            height: 70px;
            background: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 6%;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
        }

        .logo {
            font-size: 28px;
            font-weight: 800;
            color: #ff4d2d;
            cursor: pointer;
        }

        .logo span {
            color: #222;
        }

        .nav-btn {
            border: none;
            background: #ff4d2d;
            color: white;
            padding: 11px 20px;
            border-radius: 9px;
            font-weight: bold;
            cursor: pointer;
        }

        .page {
            width: 92%;
            max-width: 950px;
            margin: 45px auto;
        }

        .success-card {
            background: white;
            border-radius: 22px;
            padding: 42px;
            text-align: center;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.08);
        }

        .success-icon {
            width: 90px;
            height: 90px;
            margin: 0 auto 22px;
            border-radius: 50%;
            background: #e8f8ee;
            color: #159447;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 48px;
            font-weight: bold;
        }

        h1 {
            font-size: 34px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #777;
            font-size: 16px;
            margin-bottom: 30px;
        }

        .order-box {
            background: #fafafa;
            border: 1px solid #eee;
            border-radius: 16px;
            padding: 22px;
            text-align: left;
            margin-bottom: 25px;
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
            gap: 15px;
        }

        .order-header h2 {
            font-size: 20px;
        }

        .status {
            background: #fff1eb;
            color: #ff4d2d;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .info-item {
            background: white;
            border-radius: 12px;
            padding: 15px;
            border: 1px solid #eee;
        }

        .label {
            display: block;
            color: #888;
            font-size: 12px;
            margin-bottom: 6px;
        }

        .value {
            font-weight: 700;
            font-size: 15px;
        }

        .items-box {
            margin-top: 20px;
        }

        .items-box h3 {
            margin-bottom: 12px;
            font-size: 18px;
        }

        .item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 13px 0;
            border-bottom: 1px solid #eee;
        }

        .item:last-child {
            border-bottom: none;
        }

        .item-name {
            font-weight: 600;
        }

        .item-qty {
            color: #777;
            font-size: 14px;
        }

        .item-price {
            font-weight: 700;
        }

        .total-box {
            margin-top: 18px;
            padding-top: 18px;
            border-top: 2px dashed #ddd;
            display: flex;
            justify-content: space-between;
            font-size: 19px;
            font-weight: 800;
        }

        .address-box {
            margin-top: 20px;
            background: #fff8f5;
            border: 1px solid #ffe1d6;
            border-radius: 13px;
            padding: 16px;
        }

        .address-box h3 {
            font-size: 17px;
            margin-bottom: 8px;
        }

        .address-box p {
            color: #666;
            line-height: 1.6;
        }

        .actions {
            display: flex;
            justify-content: center;
            gap: 14px;
            margin-top: 28px;
            flex-wrap: wrap;
        }

        .primary-btn,
        .secondary-btn {
            border: none;
            padding: 13px 22px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
        }

        .primary-btn {
            background: #ff4d2d;
            color: white;
        }

        .secondary-btn {
            background: #222;
            color: white;
        }

        .empty {
            text-align: center;
            padding: 70px 20px;
        }

        .empty h2 {
            margin-bottom: 10px;
        }

        .empty p {
            color: #777;
            margin-bottom: 20px;
        }

        @media (max-width: 650px) {
            .success-card {
                padding: 25px 18px;
            }

            h1 {
                font-size: 28px;
            }

            .info-grid {
                grid-template-columns: 1fr;
            }

            .order-header {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>

<body>

<nav class="navbar">
    <div class="logo" onclick="goHome()">
        Smart<span>Food</span>
    </div>

    <button class="nav-btn" onclick="goHome()">
        Home
    </button>
</nav>

<div class="page">

    <div class="success-card" id="successCard">

        <div class="success-icon">
            ✓
        </div>

        <h1>Order Confirmed!</h1>

        <p class="subtitle">
            Thank you for ordering with SmartFood.
            Your food is being prepared.
        </p>

        <div class="order-box">

            <div class="order-header">
                <h2 id="orderNumber">
                    Order #
                </h2>

                <div class="status" id="orderStatus">
                    PLACED
                </div>
            </div>

            <div class="info-grid">

                <div class="info-item">
                    <span class="label">
                        Customer
                    </span>

                    <span class="value" id="customerName">
                        -
                    </span>
                </div>

                <div class="info-item">
                    <span class="label">
                        Payment
                    </span>

                    <span class="value" id="paymentMethod">
                        -
                    </span>
                </div>

                <div class="info-item">
                    <span class="label">
                        Order Date
                    </span>

                    <span class="value" id="orderDate">
                        -
                    </span>
                </div>

                <div class="info-item">
                    <span class="label">
                        Total Amount
                    </span>

                    <span class="value" id="orderTotal">
                        ₹0
                    </span>
                </div>

            </div>

            <div class="items-box">

                <h3>Order Items</h3>

                <div id="itemsList"></div>

                <div class="total-box">
                    <span>Total</span>
                    <span id="grandTotal">₹0</span>
                </div>

            </div>

            <div class="address-box">

                <h3>Delivery Address</h3>

                <p id="deliveryAddress">
                    -
                </p>

            </div>

        </div>

        <div class="actions">

            <button
                    class="primary-btn"
                    onclick="trackOrder()">
                Track Order
            </button>

            <button
                    class="secondary-btn"
                    onclick="goRestaurant()">
                Order More Food
            </button>

        </div>

    </div>

    <div class="success-card empty" id="emptyCard" style="display:none;">

        <h2>No Recent Order Found</h2>

        <p>
            Please place an order first.
        </p>

        <button
                class="primary-btn"
                onclick="goRestaurant()">
            Browse Restaurant
        </button>

    </div>

</div>

<script>

    function goHome() {
        window.location.href = "/";
    }

    function goRestaurant() {
        window.location.href = "/restaurant";
    }

    function trackOrder() {
        window.location.href = "/order-tracking";
    }

    function formatDate(dateValue) {

        if (!dateValue) {
            return "-";
        }

        const date = new Date(dateValue);

        if (isNaN(date.getTime())) {
            return dateValue;
        }

        return date.toLocaleString("en-IN", {
            day: "2-digit",
            month: "short",
            year: "numeric",
            hour: "2-digit",
            minute: "2-digit"
        });
    }

    function formatPayment(payment) {

        if (!payment) {
            return "-";
        }

        return payment
            .replaceAll("_", " ")
            .replace(/\b\w/g, char => char.toUpperCase());
    }

    function loadOrder() {

        const savedOrder =
            localStorage.getItem("smartFoodLastOrder");

        if (!savedOrder) {

            document.getElementById("successCard")
                .style.display = "none";

            document.getElementById("emptyCard")
                .style.display = "block";

            return;
        }

        try {

            const order =
                JSON.parse(savedOrder);

            const orderId =
                order.orderId ||
                order.backendOrderId ||
                "-";

            document.getElementById("orderNumber")
                .innerText =
                "Order #" + orderId;

            document.getElementById("orderStatus")
                .innerText =
                order.status || "PLACED";

            document.getElementById("customerName")
                .innerText =
                order.customer?.fullName || "-";

            document.getElementById("paymentMethod")
                .innerText =
                formatPayment(
                    order.paymentMethod
                );

            document.getElementById("orderDate")
                .innerText =
                formatDate(
                    order.orderDate
                );

            const grandTotal =
                Number(
                    order.grandTotal ||
                    order.totalAmount ||
                    0
                );

            document.getElementById("orderTotal")
                .innerText =
                "₹" + grandTotal;

            document.getElementById("grandTotal")
                .innerText =
                "₹" + grandTotal;

            const customer =
                order.customer || {};

            document.getElementById(
                "deliveryAddress"
            ).innerText =
                `${customer.address || ""}, ` +
                `${customer.city || ""} - ` +
                `${customer.pincode || ""}`;


            const itemsList =
                document.getElementById("itemsList");

            itemsList.innerHTML = "";

            const items =
                order.items || [];

            if (items.length === 0) {

                itemsList.innerHTML =
                    `<p style="color:#777;">
                        No item information available.
                     </p>`;

                return;
            }

            items.forEach(item => {

                const itemName =
                    item.name ||
                    item.food?.name ||
                    "Food Item";

                const quantity =
                    Number(item.quantity || 1);

                const price =
                    Number(item.price || 0);

                const itemTotal =
                    price * quantity;

                const row =
                    document.createElement("div");

                row.className = "item";

                row.innerHTML = `
                    <div>
                        <div class="item-name">
                            ${itemName}
                        </div>

                        <div class="item-qty">
                            Qty: ${quantity}
                        </div>
                    </div>

                    <div class="item-price">
                        ₹${itemTotal}
                    </div>
                `;

                itemsList.appendChild(row);

            });

        } catch (error) {

            console.error(
                "Order loading failed:",
                error
            );

            document.getElementById("successCard")
                .style.display = "none";

            document.getElementById("emptyCard")
                .style.display = "block";
        }
    }

    loadOrder();

</script>

</body>
</html>
