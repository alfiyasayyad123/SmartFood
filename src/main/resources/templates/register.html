<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | SmartFood</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;

            background:
                    linear-gradient(
                            rgba(0,0,0,0.45),
                            rgba(0,0,0,0.45)
                    ),
                    url("https://images.unsplash.com/photo-1515003197210-e0cd71810b5f?auto=format&fit=crop&w=1600&q=80");

            background-size: cover;
            background-position: center;
        }


        /* MAIN CONTAINER */

        .register-container {

            width: 920px;
            max-width: 95%;

            min-height: 580px;

            display: flex;

            border-radius: 25px;

            overflow: hidden;

            background: rgba(255,255,255,0.97);

            box-shadow:
                    0 20px 60px rgba(0,0,0,0.35);
        }


        /* LEFT SIDE */

        .left-section {

            width: 50%;

            background:
                    linear-gradient(
                            135deg,
                            #ff4d2d,
                            #ff7a18
                    );

            color: white;

            padding: 55px 45px;

            display: flex;
            flex-direction: column;
            justify-content: center;

            position: relative;

            overflow: hidden;
        }


        .left-section::before {

            content: "";

            position: absolute;

            width: 300px;
            height: 300px;

            border-radius: 50%;

            background:
                    rgba(255,255,255,0.08);

            top: -120px;
            right: -100px;
        }


        .left-section::after {

            content: "";

            position: absolute;

            width: 230px;
            height: 230px;

            border-radius: 50%;

            background:
                    rgba(255,255,255,0.07);

            bottom: -100px;
            left: -80px;
        }


        .logo {

            font-size: 32px;

            font-weight: 800;

            margin-bottom: 30px;

            position: relative;

            z-index: 2;
        }


        .logo span {

            color: #fff3d6;
        }


        .left-section h1 {

            font-size: 40px;

            line-height: 1.15;

            margin-bottom: 20px;

            position: relative;

            z-index: 2;
        }


        .left-section p {

            font-size: 16px;

            line-height: 1.7;

            opacity: 0.95;

            max-width: 360px;

            position: relative;

            z-index: 2;
        }


        .food-icons {

            display: flex;

            gap: 18px;

            margin-top: 35px;

            font-size: 38px;

            position: relative;

            z-index: 2;
        }


        /* RIGHT SIDE */

        .right-section {

            width: 50%;

            padding: 45px 50px;

            display: flex;

            flex-direction: column;

            justify-content: center;
        }


        .right-section h2 {

            font-size: 30px;

            color: #222;

            margin-bottom: 8px;
        }


        .subtitle {

            color: #777;

            font-size: 14px;

            margin-bottom: 27px;
        }


        /* INPUT */

        .input-group {

            margin-bottom: 17px;
        }


        .input-group label {

            display: block;

            font-size: 14px;

            font-weight: 600;

            color: #333;

            margin-bottom: 7px;
        }


        .input-box {

            width: 100%;

            height: 48px;

            border: 1px solid #ddd;

            border-radius: 10px;

            padding: 0 14px;

            font-size: 14px;

            outline: none;

            transition: 0.3s;
        }


        .input-box:focus {

            border-color: #ff5a36;

            box-shadow:
                    0 0 0 3px
                    rgba(255,90,54,0.1);
        }


        /* PASSWORD */

        .password-wrapper {

            position: relative;
        }


        .password-wrapper input {

            padding-right: 50px;
        }


        .show-password {

            position: absolute;

            right: 15px;

            top: 50%;

            transform: translateY(-50%);

            border: none;

            background: transparent;

            cursor: pointer;

            font-size: 18px;
        }


        /* BUTTON */

        .register-button {

            width: 100%;

            height: 52px;

            border: none;

            border-radius: 10px;

            background:
                    linear-gradient(
                            135deg,
                            #ff4d2d,
                            #ff7a18
                    );

            color: white;

            font-size: 16px;

            font-weight: 700;

            cursor: pointer;

            margin-top: 4px;

            transition: 0.3s;
        }


        .register-button:hover {

            transform: translateY(-2px);

            box-shadow:
                    0 8px 20px
                    rgba(255,77,45,0.3);
        }


        .register-button:disabled {

            opacity: 0.7;

            cursor: not-allowed;

            transform: none;
        }


        /* MESSAGE */

        .message {

            display: none;

            margin-top: 15px;

            padding: 11px;

            border-radius: 8px;

            font-size: 13px;

            text-align: center;
        }


        .message.error {

            display: block;

            background: #ffe5e5;

            color: #d60000;
        }


        .message.success {

            display: block;

            background: #e5f8eb;

            color: #16803c;
        }


        /* LOGIN LINK */

        .login-text {

            text-align: center;

            margin-top: 20px;

            color: #777;

            font-size: 14px;
        }


        .login-text a {

            color: #ff4d2d;

            text-decoration: none;

            font-weight: 700;
        }


        .login-text a:hover {

            text-decoration: underline;
        }


        .back-home {

            text-align: center;

            margin-top: 15px;
        }


        .back-home a {

            color: #555;

            font-size: 13px;

            text-decoration: none;
        }


        .back-home a:hover {

            color: #ff4d2d;
        }


        /* RESPONSIVE */

        @media(max-width: 750px) {

            .register-container {

                flex-direction: column;

                min-height: auto;
            }


            .left-section,
            .right-section {

                width: 100%;
            }


            .left-section {

                padding: 35px 30px;
            }


            .left-section h1 {

                font-size: 32px;
            }


            .food-icons {

                margin-top: 20px;
            }


            .right-section {

                padding: 40px 30px;
            }

        }

    </style>

</head>


<body>


<div class="register-container">


    <!-- LEFT SECTION -->

    <div class="left-section">

        <div class="logo">

            🍴 Smart<span>Food</span>

        </div>


        <h1>

            Good food<br>
            starts here. 🍕

        </h1>


        <p>

            Create your SmartFood account and
            discover delicious meals from your
            favourite restaurants.

        </p>


        <div class="food-icons">

            🍕 🍔 🍜 🍰

        </div>

    </div>



    <!-- RIGHT SECTION -->

    <div class="right-section">


        <h2>

            Create Account ✨

        </h2>


        <p class="subtitle">

            Join SmartFood and start ordering

        </p>



        <!-- REGISTER FORM -->

        <form id="registerForm">


            <!-- FULL NAME -->

            <div class="input-group">

                <label for="fullName">

                    Full Name

                </label>


                <input

                        type="text"

                        id="fullName"

                        class="input-box"

                        placeholder="Enter your full name"

                        required

                >

            </div>



            <!-- EMAIL -->

            <div class="input-group">

                <label for="email">

                    Email Address

                </label>


                <input

                        type="email"

                        id="email"

                        class="input-box"

                        placeholder="Enter your email"

                        required

                >

            </div>



            <!-- PASSWORD -->

            <div class="input-group">

                <label for="password">

                    Password

                </label>


                <div class="password-wrapper">

                    <input

                            type="password"

                            id="password"

                            class="input-box"

                            placeholder="Create a password"

                            minlength="6"

                            required

                    >


                    <button

                            type="button"

                            class="show-password"

                            onclick="togglePassword('password', this)"

                    >

                        👁️

                    </button>

                </div>

            </div>



            <!-- CONFIRM PASSWORD -->

            <div class="input-group">

                <label for="confirmPassword">

                    Confirm Password

                </label>


                <div class="password-wrapper">

                    <input

                            type="password"

                            id="confirmPassword"

                            class="input-box"

                            placeholder="Confirm your password"

                            minlength="6"

                            required

                    >


                    <button

                            type="button"

                            class="show-password"

                            onclick="togglePassword('confirmPassword', this)"

                    >

                        👁️

                    </button>

                </div>

            </div>



            <!-- BUTTON -->

            <button

                    type="submit"

                    class="register-button"

                    id="registerButton"

            >

                Create Account

            </button>


        </form>



        <!-- MESSAGE -->

        <div

                id="message"

                class="message"

        ></div>



        <!-- LOGIN -->

        <div class="login-text">

            Already have an account?

            <a href="/login">

                Login

            </a>

        </div>



        <!-- HOME -->

        <div class="back-home">

            <a href="/home">

                ← Back to Home

            </a>

        </div>


    </div>

</div>



<script>


    /* PASSWORD SHOW / HIDE */

    function togglePassword(
        fieldId,
        button
    ) {

        const field =
            document.getElementById(fieldId);


        if (field.type === "password") {

            field.type = "text";

            button.innerText = "🙈";

        } else {

            field.type = "password";

            button.innerText = "👁️";

        }

    }



    /* REGISTER */

    const registerForm =
        document.getElementById(
            "registerForm"
        );


    const registerButton =
        document.getElementById(
            "registerButton"
        );


    const message =
        document.getElementById(
            "message"
        );


    registerForm.addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const fullName =
                document.getElementById(
                    "fullName"
                ).value.trim();


            const email =
                document.getElementById(
                    "email"
                ).value.trim();


            const password =
                document.getElementById(
                    "password"
                ).value;


            const confirmPassword =
                document.getElementById(
                    "confirmPassword"
                ).value;



            /* PASSWORD CHECK */

            if (password !== confirmPassword) {

                message.className =
                    "message error";

                message.innerText =
                    "Passwords do not match.";

                return;

            }



            if (password.length < 6) {

                message.className =
                    "message error";

                message.innerText =
                    "Password must contain at least 6 characters.";

                return;

            }



            message.className =
                "message";

            message.innerText =
                "";


            registerButton.disabled =
                true;

            registerButton.innerText =
                "Creating Account...";



            try {


                const response =
                    await fetch(
                        "/api/users/register",
                        {

                            method: "POST",

                            headers: {

                                "Content-Type":
                                    "application/json"

                            },

                            body: JSON.stringify({

                                fullName:
                                fullName,

                                email:
                                email,

                                password:
                                password,

                                role:
                                    "CUSTOMER"

                            })

                        }
                    );



                const result =
                    await response.json();



                if (!response.ok) {

                    throw new Error(

                        result.message ||
                        "Registration failed."

                    );

                }



                /* SUCCESS */

                message.className =
                    "message success";


                message.innerText =
                    "Account created successfully! Redirecting to login...";



                registerForm.reset();



                setTimeout(
                    function() {

                        window.location.href =
                            "/login";

                    },
                    1200
                );


            }

            catch (error) {


                console.error(
                    "Registration Error:",
                    error
                );


                message.className =
                    "message error";


                message.innerText =
                    error.message ||
                    "Something went wrong. Please try again.";

            }


            finally {

                registerButton.disabled =
                    false;

                registerButton.innerText =
                    "Create Account";

            }

        }
    );

</script>


</body>

</html>
